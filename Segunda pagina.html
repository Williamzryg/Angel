body{

    grid-template-areas:
    "header header"
    "nav nav"
    "section aside"
    "footer footer";

    gap:10px;
}

header{

}

nav{

}

nav ul{

    flex-wrap:wrap;

    padding:0;
}

.nav-btn{

}

.nav-btn:hover{
    background-color:#ffbe0b;
    color:black;
}

section{
    grid-area:section;
    background:white;
    padding:20px;
    border:2px solid #8338ec;
}

section h2{
    color:#8338ec;
}

section ul,
section ol{
    background:#efe6ff;
    border:2px solid #8338ec;
    border-radius:6px;
    padding:15px 35px;
    margin-bottom:20px;
}

aside{
    grid-area:aside;
    background:#ffe5a5;
    padding:15px;
    border:2px solid #ffbe0b;
}

footer{
    grid-area:footer;
    background:#10002b;
    color:white;
    text-align:center;
    padding:15px;
}

footer ul{
    list-style:none;
    padding:0;
}

footer a{
    color:#ffbe0b;
    text-decoration:none;
}

.regresar{
    display:block;
    text-align:center;
    margin:20px auto;
    width:200px;
    text-decoration:none;
    background:#8338ec;
    color:white;
    padding:10px;
    border-radius:5px;
}

</style>
