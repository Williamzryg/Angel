<title>Tablas en HTML</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:0;
    background-color:#f4f4f4;
    color:#222;

    display:grid;
    grid-template-areas:
    "header header"
    "nav nav"
    "section aside"
    "footer footer";

    grid-template-columns:3fr 1fr;
    gap:10px;
}

header{
    grid-area:header;
    background-color:#8338ec;
    color:white;
    text-align:center;
    padding:20px;
    border-bottom:5px solid #ffbe0b;
}

nav{
    grid-area:nav;
    background-color:#10002b;
    padding:10px;
}

nav ul{
    list-style:none;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin:0;
    padding:0;
}

.nav-btn{
    background-color:#3a86ff;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:5px;
    font-weight:bold;
}

.nav-btn:hover{
    background-color:#ffbe0b;
    color:black;
}

section{
    grid-area:section;
    background:white;
    padding:20px;
    border:2px solid #8338ec;
}

section h2{
    color:#8338ec;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:30px;
}

th,td{
    border:1px solid #8338ec;
    padding:8px;
    text-align:center;
}

th{
    background-color:#8338ec;
    color:white;
}

tr:nth-child(even){
    background-color:#f2f2f2;
}

aside{
    grid-area:aside;
    background:#ffe5a5;
    padding:15px;
    border:2px solid #ffbe0b;
}

footer{
    grid-area:footer;
    background:#10002b;
    color:white;
    text-align:center;
    padding:15px;
}

footer ul{
    list-style:none;
    padding:0;
}

footer a{
    color:#ffbe0b;
    text-decoration:none;
}

</style>

</head>
